name: Pull Request

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: 'Branch name or SHA to checkout'
        required: false
        type: string
    secrets:
      PINECONE_API_KEY:
        required: true
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only == 'true' }}
    steps:
      # No checkout: without a local clone, dorny/paths-filter fetches the
      # changed-file list from the GitHub API for pull_request events, which
      # needs no fetch depth. Only pull_request has a base to diff against;
      # push/dispatch/workflow_call (release.yml's gate) leave this step
      # skipped, so docs_only stays false and every job below runs as it
      # does today.
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            docs_only:
              - '**/*.md'
              - 'guides/**'

  basic-hygiene:
    name: Linting, formatting, documentation, etc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Prettier
        run: npm run format
      - name: Check for prettier changes
        shell: bash
        run: |
          git diff --exit-code > /dev/null 2>&1 || EXIT_CODE=$?; echo "Exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Prettier changes detected. Please run 'npm run format' and commit the changes."
            echo "Summary of changes: "
            git diff
            exit 1
          fi
      - name: ESLint
        run: npm run lint
      - name: TypeDoc
        uses: ./.github/actions/build-docs

  testing:
    needs: [changes]
    uses: './.github/workflows/testing.yml'
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
